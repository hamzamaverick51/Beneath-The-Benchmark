<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Beneath the Benchmark — LABUST underwater vision collaboration</title>
  <desc id="desc">An editorial research banner with a sonar data motif: 2,646 exports, 1,206 distinct frames, and all 17 source videos crossing the delivered split.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071b25"/><stop offset=".65" stop-color="#0b3039"/><stop offset="1" stop-color="#14515a"/></linearGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#72a9a8" stroke-width=".7" opacity=".18"/></pattern>
  </defs>
  <rect width="1200" height="400" rx="14" fill="url(#ocean)"/>
  <rect width="1200" height="400" rx="14" fill="url(#grid)"/>
  <path d="M728 200H1200M950 0V400" stroke="#80bbb9" opacity=".25"/>
  <circle cx="950" cy="200" r="182" fill="none" stroke="#83beb9" opacity=".30"/>
  <circle cx="950" cy="200" r="132" fill="none" stroke="#83beb9" opacity=".48"/>
  <circle cx="950" cy="200" r="78" fill="none" stroke="#a4eee0"/>
  <circle cx="1112" cy="117" r="5" fill="#d7ec86"/>
  <circle cx="788" cy="280" r="5" fill="#d7ec86"/>
  <rect x="48" y="39" width="318" height="30" rx="15" fill="#17454a" stroke="#6db4aa" stroke-width=".8"/>
  <text x="65" y="59" fill="#baf6e9" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">INDEPENDENT LABUST COLLABORATION</text>
  <text x="44" y="159" fill="#f9fcf5" font-family="Arial,Helvetica,sans-serif" font-size="71" font-weight="700" letter-spacing="-4">Beneath the</text>
  <text x="44" y="230" fill="#a4eee0" font-family="Georgia,serif" font-size="77" font-style="italic" letter-spacing="-3">Benchmark</text>
  <text x="49" y="282" fill="#c3d8d3" font-family="Arial,Helvetica,sans-serif" font-size="21">Underwater vision, from data integrity to edge inference.</text>
  <path d="M49 317H646" stroke="#5d8e8f"/>
  <text x="49" y="347" fill="#a8d1cb" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="1">HAMZA RAHEEL  /  LABUST AT FER, UNIVERSITY OF ZAGREB  /  2026</text>
